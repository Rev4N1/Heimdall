name: CI
on:
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild and re-upload even if the release already exists
        type: boolean
        default: false
  schedule:
    - cron: "0 16 * * *"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  UPSTREAM: https://git.sr.ht/~grimler/Heimdall
  # Linked statically into the Linux and macOS binaries
  LIBUSB_VERSION: 1.0.29

jobs:
  check:
    name: Check upstream
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.check.outputs.tag }}
      build: ${{ steps.check.outputs.build }}
    steps:
    - name: Resolve latest tag
      id: check
      env:
        GH_TOKEN: ${{ github.token }}
        FORCE: ${{ inputs.force }}
      run: |
          tag=$(git ls-remote --tags --refs --sort=-v:refname "$UPSTREAM" 'v*' | head -1 | sed 's#.*refs/tags/##')
          [ -n "$tag" ] || { echo "::error::No upstream tag found"; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [ "$FORCE" != "true" ] && gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::notice::$tag is already released, nothing to build"
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  linux-build:
    name: Linux Build
    needs: check
    if: needs.check.outputs.build == 'true'
    # Pinned instead of -latest: an older glibc keeps the binary usable on more distros
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ needs.check.outputs.tag }}
    steps:
    - name: Clone Repository
      run: git clone --depth 1 --branch "$TAG" "$UPSTREAM" Heimdall

    - name: Build static libusb
      # Built from source without udev, so nothing but glibc is left to link dynamically
      run: |
          curl -fsSL "https://github.com/libusb/libusb/releases/download/v$LIBUSB_VERSION/libusb-$LIBUSB_VERSION.tar.bz2" | tar -xj
          cd "libusb-$LIBUSB_VERSION"
          ./configure --prefix="$RUNNER_TEMP/libusb" --enable-static --disable-shared --disable-udev
          make -j"$(nproc)" install

    - name: Build
      working-directory: ./Heimdall
      env:
        PKG_CONFIG_PATH: ${{ runner.temp }}/libusb/lib/pkgconfig
      run: |
          cmake -B build -DDISABLE_FRONTEND=ON -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXE_LINKER_FLAGS="-static-libgcc -static-libstdc++"
          cmake --build build --parallel
          ./build/bin/heimdall version
          ldd build/bin/heimdall
          if ldd build/bin/heimdall | grep -E 'libusb|libudev|libstdc\+\+|libgcc_s'; then
            echo "::error::heimdall still links a bundled dependency dynamically"; exit 1
          fi
          tar -czf "../heimdall-$TAG-linux-x86_64.tar.gz" -C build/bin heimdall

    - name: Upload build to artifacts
      uses: actions/upload-artifact@v7
      with:
        name: linux-build
        path: heimdall-*.tar.gz

  macos-build:
    name: MacOS Build
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: macos-latest
    env:
      TAG: ${{ needs.check.outputs.tag }}
    steps:
    - name: Clone Repository
      run: git clone --depth 1 --branch "$TAG" "$UPSTREAM" Heimdall

    - name: Install dependencies
      run: brew install pkgconf

    - name: Build static libusb
      run: |
          curl -fsSL "https://github.com/libusb/libusb/releases/download/v$LIBUSB_VERSION/libusb-$LIBUSB_VERSION.tar.bz2" | tar -xj
          cd "libusb-$LIBUSB_VERSION"
          ./configure --prefix="$RUNNER_TEMP/libusb" --enable-static --disable-shared
          make -j"$(sysctl -n hw.ncpu)" install

    - name: Build
      working-directory: ./Heimdall
      env:
        PKG_CONFIG_PATH: ${{ runner.temp }}/libusb/lib/pkgconfig
      run: |
          # Upstream already adds IOKit and CoreFoundation; static libusb also needs Security
          cmake -B build -DDISABLE_FRONTEND=ON -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXE_LINKER_FLAGS="-framework Security"
          cmake --build build --parallel
          ./build/bin/heimdall version
          otool -L build/bin/heimdall
          if otool -L build/bin/heimdall | tail -n +2 | grep -Ev '^[[:space:]]+/(usr/lib|System/Library)/'; then
            echo "::error::heimdall links a non-system library dynamically"; exit 1
          fi
          tar -czf "../heimdall-$TAG-macos-arm64.tar.gz" -C build/bin heimdall

    - name: Upload build to artifacts
      uses: actions/upload-artifact@v7
      with:
        name: macos-build
        path: heimdall-*.tar.gz

  win-build:
    name: Windows Build
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: windows-latest
    env:
      TAG: ${{ needs.check.outputs.tag }}
    steps:
    - name: Clone Repository
      run: git clone --depth 1 --branch "$env:TAG" "$env:UPSTREAM" Heimdall

    - name: Install dependencies
      uses: msys2/setup-msys2@v2
      with:
        msystem: UCRT64
        update: true
        pacboy: >-
          gcc:p
          cmake:p
          ninja:p
          libusb:p
          pkgconf:p

    - name: Build
      working-directory: ./Heimdall
      shell: msys2 {0}
      run: |
          # Upstream links with -static, but pkg-config resolves libusb to the DLL import
          # library; removing it leaves only libusb-1.0.a for the linker to find
          rm /ucrt64/lib/libusb-1.0.dll.a
          cmake -B build -G Ninja -DDISABLE_FRONTEND=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build build
          ./build/bin/heimdall.exe version
          ldd build/bin/heimdall.exe
          if ldd build/bin/heimdall.exe | grep -i '/ucrt64/'; then
            echo "::error::heimdall.exe links an MSYS2 DLL dynamically"; exit 1
          fi

    - name: Create archive
      run: |
          # Runs outside the MSYS2 shell, so this fails if the exe still needs an MSYS2 DLL
          ./Heimdall/build/bin/heimdall.exe version
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Compress-Archive -Path Heimdall/build/bin/* -DestinationPath "heimdall-$env:TAG-windows-x86_64.zip"

    - name: Upload build to artifacts
      uses: actions/upload-artifact@v7
      with:
        name: win-build
        path: heimdall-*.zip

  release:
    name: Release
    needs: [check, linux-build, macos-build, win-build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Get builds from artifacts
      uses: actions/download-artifact@v8
      with:
        pattern: "*-build"
        merge-multiple: true

    - name: Upload builds to release
      uses: softprops/action-gh-release@v3
      with:
        tag_name: ${{ needs.check.outputs.tag }}
        name: Heimdall ${{ needs.check.outputs.tag }}
        body: Built from [${{ needs.check.outputs.tag }}](${{ env.UPSTREAM }}/refs/${{ needs.check.outputs.tag }}) of ${{ env.UPSTREAM }}
        files: heimdall-*
        overwrite_files: true
        fail_on_unmatched_files: true

  documentation:
    name: Update Documentation
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Checkout source code
      uses: actions/checkout@v7

    - name: Update README.md and LICENSE.md
      run: |
          sync_doc() {
            curl -fsSL "$UPSTREAM/blob/master/$1" -o "$RUNNER_TEMP/$1"
            touch "$3"
            sed -i "/<!-- $2:START -->/,/<!-- $2:END -->/d" "$3"
            { echo "<!-- $2:START -->"; cat "$RUNNER_TEMP/$1"; echo "<!-- $2:END -->"; } >> "$3"
          }
          sync_doc README.md README README.md
          sync_doc LICENSE LICENSE LICENSE.md

    - name: Push
      run: |
          git add README.md LICENSE.md
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update documentation"
          git push
